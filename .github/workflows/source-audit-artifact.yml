name: Apply dashboard repair

on:
  push:
    branches:
      - agent/backend-dashboard-audit

permissions:
  contents: write

jobs:
  apply-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/backend-dashboard-audit
      - name: Apply, format and commit dashboard repair
        run: |
          if [ ! -f docs/dashboard-repair.ready ]; then
            echo "Repair package is not complete yet."
            exit 0
          fi

          cat docs/dashboard-repair.part* > /tmp/dashboard-repair.b64
          base64 --decode /tmp/dashboard-repair.b64 > /tmp/dashboard-repair.tar.gz
          tar -xzf /tmp/dashboard-repair.tar.gz -C .
          rm docs/dashboard-repair.part* docs/dashboard-repair.ready

          npm ci
          npm run format

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair backend dashboard workflows"
          git push origin HEAD:agent/backend-dashboard-audit
