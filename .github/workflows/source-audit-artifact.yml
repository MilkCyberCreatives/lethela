name: Source audit artifact

on:
  push:
    branches:
      - agent/backend-dashboard-audit
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Package source safely
        run: tar --exclude=.git --exclude=node_modules --exclude=.next --exclude='*.env*' -czf /tmp/lethela-source.tgz .
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: lethela-source-audit
          path: /tmp/lethela-source.tgz
          retention-days: 1
          if-no-files-found: error
