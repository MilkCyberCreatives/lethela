name: Audit Lighthouse SEO release

on:
  push:
    branches:
      - agent/seo-social-performance

permissions:
  contents: write

concurrency:
  group: lighthouse-seo-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Measure built application
    if: github.repository == 'MilkCyberCreatives/lethela'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: file:./ci.db
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXTAUTH_SECRET: ci-only-nextauth-secret-not-for-production
      VENDOR_SESSION_SECRET: ci-only-vendor-secret
      RIDER_CONSOLE_SECRET: ci-only-rider-secret
      ADMIN_APPROVAL_KEY: ci-only-admin-key
      CRON_SECRET: ci-only-cron-secret
      BANK_DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ALLOW_DEV_ADMIN_BYPASS: false
      DEMO_CATALOG_MODE: false
      ALLOW_PUBLIC_DEMO_ORDER: false
      EMAIL_VERIFICATION_REQUIRED: false
      NEXT_PUBLIC_MARKETPLACE_LAUNCH_MODE: prelaunch
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/seo-social-performance
          fetch-depth: 0

      - name: Confirm one-time request
        id: request
        shell: bash
        run: |
          if [ -f .github/audit-lighthouse-seo.request ]; then
            echo "requested=true" >> "$GITHUB_OUTPUT"
          else
            echo "requested=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js 24
        if: steps.request.outputs.requested == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.request.outputs.requested == 'true'
        run: npm ci

      - name: Build production application
        if: steps.request.outputs.requested == 'true'
        run: npm run build

      - name: Start production server
        if: steps.request.outputs.requested == 'true'
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/lethela-next.log 2>&1 &
          echo $! > /tmp/lethela-next.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lethela-next.log
          exit 1

      - name: Run three Lighthouse audits
        if: steps.request.outputs.requested == 'true'
        shell: bash
        run: |
          mkdir -p .lighthouse-results
          for run in 1 2 3; do
            npx --yes lighthouse@12.8.2 http://127.0.0.1:3000/ \
              --quiet \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json \
              --output-path=".lighthouse-results/home-${run}.json"
          done

      - name: Record Lighthouse scores
        if: steps.request.outputs.requested == 'true'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const files = [1, 2, 3].map((run) => `.lighthouse-results/home-${run}.json`);
          const reports = files.map((file) => JSON.parse(fs.readFileSync(file, 'utf8')));
          const keys = ['performance', 'accessibility', 'best-practices', 'seo'];
          const labels = {
            performance: 'Performance',
            accessibility: 'Accessibility',
            'best-practices': 'Best Practices',
            seo: 'SEO',
          };
          const scores = Object.fromEntries(
            keys.map((key) => [
              key,
              reports.map((report) => Math.round((report.categories[key]?.score || 0) * 100)),
            ]),
          );
          const median = (values) => [...values].sort((a, b) => a - b)[Math.floor(values.length / 2)];
          const failures = reports[2].categories.performance.auditRefs
            .map((entry) => reports[2].audits[entry.id])
            .filter((audit) => audit && audit.score !== null && audit.score < 1 && audit.scoreDisplayMode !== 'notApplicable')
            .sort((a, b) => (a.score || 0) - (b.score || 0))
            .slice(0, 12)
            .map((audit) => `- ${audit.title}: ${audit.displayValue || `score ${Math.round((audit.score || 0) * 100)}`}`);
          const lines = [
            '# Lighthouse audit — Lethela SEO and performance release',
            '',
            'Audited the production build on localhost using Lighthouse mobile defaults on 4 August 2026.',
            '',
            '| Category | Run 1 | Run 2 | Run 3 | Median |',
            '|---|---:|---:|---:|---:|',
            ...keys.map((key) => `| ${labels[key]} | ${scores[key][0]} | ${scores[key][1]} | ${scores[key][2]} | ${median(scores[key])} |`),
            '',
            '## Remaining opportunities from the final run',
            '',
            ...(failures.length ? failures : ['- No scored Lighthouse opportunities remained.']),
            '',
            '## Important interpretation',
            '',
            'Lighthouse is a controlled lab measurement. Real-user scores can vary with device, network, location, third-party scripts, live database latency and content volume.',
            '',
            'No production database or user records were accessed or changed during this audit.',
            '',
          ];
          fs.writeFileSync('docs/LIGHTHOUSE_AUDIT_2026-08-04.md', `${lines.join('\n')}\n`);
          NODE

      - name: Remove temporary audit files
        if: always() && steps.request.outputs.requested == 'true'
        run: |
          rm -rf .lighthouse-results
          rm -f .github/audit-lighthouse-seo.request
          rm -f .github/workflows/audit-lighthouse-seo.yml

      - name: Commit audit report and cleanup
        if: always() && steps.request.outputs.requested == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Lighthouse SEO performance audit [skip ci]"
          git push origin agent/seo-social-performance
