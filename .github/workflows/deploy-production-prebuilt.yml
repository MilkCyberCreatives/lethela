name: One-time prebuilt production deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: lethela-production-prebuilt
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy production
    if: github.repository == 'MilkCyberCreatives/lethela'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_BLcgVmtxwgxliRt0sECEsRdI
      VERCEL_PROJECT_ID: prj_fQ9srYuFRdvq4rldmokUAL0S7TzN
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Confirm one-time request
        id: request
        shell: bash
        run: |
          if [ -f .github/prebuilt-production-deploy.request ]; then
            echo "requested=true" >> "$GITHUB_OUTPUT"
          else
            echo "requested=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Vercel credential availability
        id: credential
        if: steps.request.outputs.requested == 'true'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js 24
        if: steps.request.outputs.requested == 'true' && steps.credential.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        if: steps.request.outputs.requested == 'true' && steps.credential.outputs.available == 'true'
        run: npm ci

      - name: Install pinned Vercel CLI
        if: steps.request.outputs.requested == 'true' && steps.credential.outputs.available == 'true'
        run: npm install --global vercel@50.15.1

      - name: Pull production project settings
        if: steps.request.outputs.requested == 'true' && steps.credential.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production output in GitHub Actions
        if: steps.request.outputs.requested == 'true' && steps.credential.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output to production
        if: steps.request.outputs.requested == 'true' && steps.credential.outputs.available == 'true'
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $deployment_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Record deployment status
        if: always() && steps.request.outputs.requested == 'true'
        shell: bash
        run: |
          if [ "${{ steps.credential.outputs.available }}" != "true" ]; then
            cat > docs/VERCEL_DEPLOYMENT_STATUS.md <<'EOF'
          # Vercel deployment status

          The Lethela launch-readiness release is merged and passed the full GitHub validation pipeline, but the one-time prebuilt production deployment could not run because the repository does not currently have a `VERCEL_TOKEN` Actions secret.

          The normal Vercel Git deployment was also rejected by the account build-rate limit. Production therefore remains on the previously successful deployment until the rate limit resets, the Vercel plan changes, or a scoped deployment token is added to GitHub Actions.

          No production database or user records were changed by this blocked deployment attempt.
          EOF
          elif [ "${{ steps.deploy.outcome }}" = "success" ]; then
            cat > docs/VERCEL_DEPLOYMENT_STATUS.md <<EOF
          # Vercel deployment status

          The Lethela launch-readiness release was deployed to production as a validated prebuilt artifact.

          Deployment URL: ${{ steps.deploy.outputs.url }}
          Source branch: main
          GitHub commit: ${{ github.sha }}
          EOF
          else
            cat > docs/VERCEL_DEPLOYMENT_STATUS.md <<'EOF'
          # Vercel deployment status

          The Lethela launch-readiness release is merged and validated, but the prebuilt production deployment did not complete. Review the GitHub Actions deployment job and Vercel project access before retrying.

          No production database or user records were changed by this deployment attempt.
          EOF
          fi

      - name: Remove one-time deployment files
        if: always() && steps.request.outputs.requested == 'true'
        run: |
          rm -f .github/prebuilt-production-deploy.request
          rm -f .github/workflows/deploy-production-prebuilt.yml

      - name: Commit deployment status and cleanup
        if: always() && steps.request.outputs.requested == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Vercel production deployment status [skip ci]"
          git push origin main
