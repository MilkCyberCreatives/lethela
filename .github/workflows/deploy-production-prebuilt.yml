name: Deploy production prebuilt

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lethela-production-prebuilt
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      VERCEL_ORG_ID: team_BLcgVmtxwgxliRt0sECEsRdI
      VERCEL_PROJECT_ID: prj_fQ9srYuFRdvq4rldmokUAL0S7TzN
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Confirm Vercel credential
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Add a scoped VERCEL_TOKEN repository or production-environment secret before running this workflow."
            exit 1
          fi

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Revalidate the release
        env:
          DATABASE_PROVIDER: sqlite
          DATABASE_URL: file:./ci.db
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: deployment-validation-secret
          VENDOR_SESSION_SECRET: deployment-vendor-secret
          RIDER_CONSOLE_SECRET: deployment-rider-secret
          ADMIN_APPROVAL_KEY: deployment-admin-secret
          CRON_SECRET: deployment-cron-secret
          BANK_DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          EMAIL_VERIFICATION_REQUIRED: "false"
          NEXT_PUBLIC_MARKETPLACE_LAUNCH_MODE: prelaunch
        run: |
          npm audit --omit=dev --audit-level=high
          npm test
          npm run typecheck
          npm run lint
          npm run format:check

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@50.15.1

      - name: Pull production project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Gate on production readiness checks
        shell: bash
        run: |
          ENV_FILE=.vercel/.env.production.local
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::$ENV_FILE not found — 'vercel pull' did not produce the production env."
            exit 1
          fi
          echo "Validating the pulled production environment against the launch rules."
          npm run check:production-env -- "$ENV_FILE"
          npm run check:security-env -- "$ENV_FILE"

      - name: Build production output in GitHub Actions
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output to production
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")"
          echo "Production deployment: $deployment_url" >> "$GITHUB_STEP_SUMMARY"

      # Non-blocking: the code deploy has already succeeded. This reports whether
      # the live site is ready to accept pilot orders (real vendors, a paid proof
      # order, notification channels). A NOT READY result means: do not switch
      # NEXT_PUBLIC_MARKETPLACE_LAUNCH_MODE to "public" yet.
      - name: Report pilot operating readiness (non-blocking)
        continue-on-error: true
        shell: bash
        run: |
          ENV_FILE=.vercel/.env.production.local
          {
            echo "### Pilot operating readiness"
            echo '```'
            npm run --silent check:operating-readiness -- "$ENV_FILE" || \
              echo "NOT READY — safe to run the code, but keep public ordering disabled."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
