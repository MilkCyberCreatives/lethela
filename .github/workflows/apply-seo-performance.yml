'''
          old_product_vendor_where = '''          vendor: {
            isActive: true,
            status: { in: ["ACTIVE", "APPROVED"] },
            ...(normalizedSuburb ? { suburb: { contains: normalizedSuburb } } : {}),
          },'''
          new_product_vendor_where = '''          vendor: {
            isActive: true,
            status: { in: ["ACTIVE", "APPROVED"] },
            temporaryClosed: false,
''' + readiness_where + '''            ...(normalizedSuburb ? { suburb: { contains: normalizedSuburb } } : {}),
          },'''
          if old_product_vendor_where not in home:
              raise RuntimeError("Home product vendor readiness block not found")
          home = home.replace(old_product_vendor_where, new_product_vendor_where, 1)
          old_vendor_where = '''          isActive: true,
          status: { in: ["ACTIVE", "APPROVED"] },
          temporaryClosed: false,
          products: { some: { isAlcohol: false, inStock: true, status: "APPROVED" } },'''
          new_vendor_where = '''          isActive: true,
          status: { in: ["ACTIVE", "APPROVED"] },
          temporaryClosed: false,
''' + readiness_where.replace("            ", "          ") + '''          products: { some: { isAlcohol: false, inStock: true, status: "APPROVED" } },'''
          if old_vendor_where not in home:
              raise RuntimeError("Home vendor readiness block not found")
          home = home.replace(old_vendor_where, new_vendor_where, 1)
          for private_line in [
              "              kycIdUrl: true,\n",
              "              kycProofUrl: true,\n",
              "              bankName: true,\n",
              "              bankAccountName: true,\n",
              "              bankAccountNumber: true,\n",
              "              bankBranchCode: true,\n",
              "          kycIdUrl: true,\n",
              "          kycProofUrl: true,\n",
              "          bankName: true,\n",
              "          bankAccountName: true,\n",
              "          bankAccountNumber: true,\n",
              "          bankBranchCode: true,\n",
          ]:
              home = home.replace(private_line, "")
          home = home.replace(
              "isPublicMarketplaceVendor(item.vendor)",
              "isPublicMarketplaceVendor({ ...item.vendor, hasBanking: true, hasKycDocuments: true })",
          )
          home = home.replace(
              ".filter((vendor: VendorWithAlcohol) => isPublicMarketplaceVendor(vendor))",
              ".filter((vendor: VendorWithAlcohol) =>\n      isPublicMarketplaceVendor({ ...vendor, hasBanking: true, hasKycDocuments: true }),\n    )",
          )
          write("src/lib/home-data.ts", home)

          # Product detail: the readiness predicate is enforced in SQL, while private fields stay server-private.
          product = read("src/app/products/[id]/page.tsx")
          product = product.replace(
              '''          temporaryClosed: false,
        },''',
              '''          temporaryClosed: false,
          phone: { not: null },
          address: { not: null },
          city: { not: null },
          province: { not: null },
          storeType: { not: null },
          etaMins: { gte: 10 },
          kycIdUrl: { not: null },
          kycProofUrl: { not: null },
          bankName: { not: null },
          bankAccountName: { not: null },
          bankAccountNumber: { not: null },
          hours: { some: { closed: false } },
        },''',
              1,
          )
          for private_line in [
              "            kycIdUrl: true,\n",
              "            kycProofUrl: true,\n",
              "            bankName: true,\n",
              "            bankAccountName: true,\n",
              "            bankAccountNumber: true,\n",
              "            bankBranchCode: true,\n",
          ]:
              product = product.replace(private_line, "")
          product = product.replace(
              "      ...product.vendor,\n      _count:",
              "      ...product.vendor,\n      hasBanking: true,\n      hasKycDocuments: true,\n      _count:",
              1,
          )
          write("src/app/products/[id]/page.tsx", product)

          # Sitemap: never fetch private document or banking values merely to build public URLs.
          sitemap = read("src/app/sitemap.ts")
          for private_line in [
              "            kycIdUrl: true,\n",
              "            kycProofUrl: true,\n",
              "            bankName: true,\n",
              "            bankAccountName: true,\n",
              "            bankAccountNumber: true,\n",
              "            bankBranchCode: true,\n",
          ]:
              sitemap = sitemap.replace(private_line, "")
          sitemap = sitemap.replace(
              "const publicVendorRows = vendorRows.filter((vendor) => isPublicMarketplaceVendor(vendor));",
              '''const publicVendorRows = vendorRows.filter((vendor) =>
    isPublicMarketplaceVendor({ ...vendor, hasBanking: true, hasKycDocuments: true }),
  );''',
              1,
          )
          write("src/app/sitemap.ts", sitemap)

          # Strip private vendor onboarding and banking values before a public vendor profile is returned.
          replace_once(
              "src/server/queries.ts",
              '''  return {
    ...vendor,
    cuisine,
    sections,
    hours: vendor.hours ?? [],
    products,
    specials: vendor.specials ?? [],
  };''',
