name: Apply SEO and performance patch

on:
  push:
    branches:
      - agent/seo-social-performance

permissions:
  contents: write

concurrency:
  group: apply-seo-performance
  cancel-in-progress: false

jobs:
  patch:
    name: Apply validated source patch
    if: github.repository == 'MilkCyberCreatives/lethela'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/seo-social-performance
          fetch-depth: 0

      - name: Confirm one-time request
        id: request
        shell: bash
        run: |
          if [ -f .github/seo-performance.request ]; then
            echo "requested=true" >> "$GITHUB_OUTPUT"
          else
            echo "requested=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply SEO, social, speed and privacy patch
        if: steps.request.outputs.requested == 'true'
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              if old not in text:
                  raise RuntimeError(f"Expected source block not found in {path}: {old[:120]!r}")
              write(path, text.replace(old, new, 1))

          def regex_once(path: str, pattern: str, replacement: str) -> None:
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f"Expected one regex match in {path}, found {count}: {pattern[:120]!r}")
              write(path, updated)

