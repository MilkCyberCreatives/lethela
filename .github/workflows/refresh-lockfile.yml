name: Refresh security lockfile

on:
  pull_request:

permissions:
  contents: read

jobs:
  refresh:
    name: Generate secure package lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh lockfile from package overrides
        run: npm install --package-lock-only --ignore-scripts

      - name: Collect audit and dependency diagnostics
        shell: bash
        run: |
          npm audit --omit=dev --json > npm-audit.json || true
          npm ls fast-uri --all > fast-uri-tree.txt || true
          npm view fast-uri dist-tags versions --json > fast-uri-registry.json || true

      - name: Upload refreshed files
        uses: actions/upload-artifact@v4
        with:
          name: secure-package-lock
          path: |
            package-lock.json
            npm-audit.json
            fast-uri-tree.txt
            fast-uri-registry.json
            src/app/admin/page.tsx
          if-no-files-found: error
          retention-days: 1
