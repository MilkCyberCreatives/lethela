name: Refresh security lockfile

on:
  pull_request:

permissions:
  contents: read

jobs:
  refresh:
    name: Generate secure package lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh lockfile from package overrides
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Upload refreshed files
        uses: actions/upload-artifact@v4
        with:
          name: secure-package-lock
          path: |
            package-lock.json
            src/app/admin/page.tsx
          if-no-files-found: error
          retention-days: 1
