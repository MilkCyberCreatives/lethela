name: Refresh dashboard lockfile

on:
  push:
    branches:
      - agent/dashboard-command-centre
    paths:
      - package.json
      - .github/workflows/refresh-dashboard-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out dashboard branch
        uses: actions/checkout@v4
        with:
          ref: agent/dashboard-command-centre

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify patched nested dependency
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const entry = lock.packages['node_modules/@sentry/bundler-plugin-core/node_modules/brace-expansion'];
          if (!entry || entry.version !== '5.0.9') {
            throw new Error(`Expected Sentry brace-expansion 5.0.9, received ${entry?.version || 'missing'}`);
          }
          console.log('Verified Sentry brace-expansion', entry.version);
          NODE
          npm audit --omit=dev --audit-level=high

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh patched dashboard dependency lockfile [skip ci]"
          git push origin HEAD:agent/dashboard-command-centre
