name: Apply mobile and search-engine readiness repairs

on:
  push:
    branches:
      - agent/mobile-search-engine-readiness

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-search-engine-readiness
          fetch-depth: 0

      - name: Apply focused mobile and SEO repairs
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, content):
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")

          def replace_once(path, old, new):
              content = read(path)
              if old not in content:
                  raise SystemExit(f"Expected pattern not found in {path}: {old[:120]!r}")
              write(path, content.replace(old, new, 1))

          def replace_all(path, old, new):
              content = read(path)
              if old not in content:
                  raise SystemExit(f"Expected pattern not found in {path}: {old[:120]!r}")
              write(path, content.replace(old, new))

          def append_once(path, marker, addition):
              content = read(path)
              if marker not in content:
                  write(path, content.rstrip() + "\n\n" + addition.strip() + "\n")

          # Root metadata: prevent homepage canonical leakage and strengthen mobile viewport.
          replace_once(
              "src/app/layout.tsx",
              '  alternates: {\n    canonical: "/",\n  },\n',
              "",
          )
          replace_once(
              "src/app/layout.tsx",
              'export const viewport: Viewport = {\n  themeColor: "#080B27",\n};',
              'export const viewport: Viewport = {\n  width: "device-width",\n  initialScale: 1,\n  viewportFit: "cover",\n  themeColor: "#080B27",\n};',
          )
          replace_once(
              "src/app/layout.tsx",
              '      name: SITE_NAME,\n      url: SITE_URL,\n      logo: absoluteUrl("/lethelalogo.svg"),',
              '      name: SITE_NAME,\n      legalName: process.env.NEXT_PUBLIC_LEGAL_ENTITY_NAME?.trim() || SITE_NAME,\n      url: SITE_URL,\n      logo: absoluteUrl("/lethelalogo.svg"),\n      areaServed: { "@type": "Country", name: "South Africa" },\n      knowsLanguage: ["en-ZA", "zu-ZA", "xh-ZA"],',
          )
          replace_once(
              "src/app/layout.tsx",
              '      areaServed: "South Africa",\n      serviceType: "Food and grocery delivery",',
              '      areaServed: [\n        { "@type": "Country", name: "South Africa" },\n        { "@type": "Place", name: "Klipfontein View, Midrand" },\n      ],\n      serviceType: "Food and grocery delivery",\n      availableChannel: {\n        "@type": "ServiceChannel",\n        serviceUrl: SITE_URL,\n        availableLanguage: ["English", "isiZulu", "isiXhosa"],\n      },\n      hasOfferCatalog: {\n        "@type": "OfferCatalog",\n        name: "Lethela marketplace categories",\n        itemListElement: ["Groceries", "Kota", "Chicken", "Burgers", "Braai", "Breakfast", "Drinks", "Snacks"].map(\n          (name) => ({ "@type": "OfferCatalog", name }),\n        ),\n      },',
          )

          # Header: preserve visuals while making small-screen navigation fit and removing duplicate cart bars.
          replace_once(
              "src/components/MainHeader.tsx",
              'import MobileCartBar from "@/components/MobileCartBar";\n',
              "",
          )
          replace_once(
              "src/components/MainHeader.tsx",
