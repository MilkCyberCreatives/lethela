name: Temporary owner access E2E patch

on:
  push:
    branches:
      - fix/owner-access-no-extra-key-20260916

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/owner-access-no-extra-key-20260916
          fetch-depth: 0

      - name: Update the owner access E2E scenario
        run: node scripts/temp-update-owner-e2e.mjs

      - name: Format the changed E2E file
        run: npx prettier --write scripts/e2e-demo.mjs

      - name: Commit only the E2E update and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/e2e-demo.mjs
          git rm scripts/temp-update-owner-e2e.mjs .github/workflows/temp-owner-e2e-patch.yml
          git diff --cached --check
          git commit -m "Align owner access E2E with authorised owner flow"
          git push origin HEAD:fix/owner-access-no-extra-key-20260916
