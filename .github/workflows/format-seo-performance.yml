name: Format SEO performance changes

on:
  push:
    branches:
      - agent/seo-social-performance

permissions:
  contents: write

concurrency:
  group: format-seo-performance
  cancel-in-progress: false

jobs:
  format:
    name: Format changed files
    if: github.repository == 'MilkCyberCreatives/lethela'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/seo-social-performance
          fetch-depth: 0

      - name: Confirm one-time request
        id: request
        shell: bash
        run: |
          if [ -f .github/format-seo-performance.request ]; then
            echo "requested=true" >> "$GITHUB_OUTPUT"
          else
            echo "requested=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js 24
        if: steps.request.outputs.requested == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.request.outputs.requested == 'true'
        run: npm ci

      - name: Apply Prettier formatting
        if: steps.request.outputs.requested == 'true'
        run: npx prettier --write src/components/Hero.tsx src/lib/home-data.ts src/lib/vendor-readiness.ts

      - name: Remove one-time files
        if: steps.request.outputs.requested == 'true'
        run: |
          rm -f .github/format-seo-performance.request
          rm -f .github/workflows/format-seo-performance.yml

      - name: Commit formatting
        if: steps.request.outputs.requested == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format SEO and performance changes"
          git push origin agent/seo-social-performance
