name: Order sweep

# Chases stuck orders (store or rider reminders, admin alerts) even when nobody
# has a Lethela page open. GitHub runs scheduled jobs every 5 minutes at best,
# sometimes later; pages that are open run the same sweep every minute.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: order-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Run the order sweep
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the live site
        run: curl --fail --silent --show-error --max-time 60 https://www.lethela.co.za/api/cron/order-sweep
