name: Remove completed dashboard formatter

on:
  push:
    branches:
      - agent/dashboard-command-centre
    paths:
      - .github/workflows/format-dashboard-files.yml

permissions:
  contents: write

jobs:
  remove-workflow:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out dashboard branch
        uses: actions/checkout@v4
        with:
          ref: agent/dashboard-command-centre

      - name: Remove completed temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-dashboard-files.yml
          git commit -m "Remove completed temporary formatter [skip ci]"
          git push origin HEAD:agent/dashboard-command-centre
