name: Format dashboard files

on:
  push:
    branches:
      - agent/dashboard-command-centre
    paths:
      - .github/workflows/format-dashboard-files.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out dashboard branch
        uses: actions/checkout@v4
        with:
          ref: agent/dashboard-command-centre

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format changed dashboard files
        run: npx prettier --write package.json src/app/api/admin/access/route.ts src/app/dashboard.css

      - name: Commit formatting
        run: |
          if git diff --quiet -- package.json src/app/api/admin/access/route.ts src/app/dashboard.css; then
            echo "Dashboard files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/app/api/admin/access/route.ts src/app/dashboard.css
          git commit -m "Format dashboard command-centre files [skip ci]"
          git push origin HEAD:agent/dashboard-command-centre
