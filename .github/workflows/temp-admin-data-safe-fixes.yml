name: Temporary admin data-safe fixes

on:
  push:
    branches:
      - fix/admin-functionality-data-safe-20260915

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: file:./ci.db
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-nextauth-secret-not-for-production
      VENDOR_SESSION_SECRET: ci-only-vendor-secret
      RIDER_CONSOLE_SECRET: ci-only-rider-secret
      ADMIN_APPROVAL_KEY: ci-only-admin-key
      CRON_SECRET: ci-only-cron-secret
      BANK_DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ALLOW_DEV_ADMIN_BYPASS: "false"
      DEMO_CATALOG_MODE: "false"
      ALLOW_PUBLIC_DEMO_ORDER: "false"
      EMAIL_VERIFICATION_REQUIRED: "false"
      NEXT_PUBLIC_MARKETPLACE_LAUNCH_MODE: prelaunch
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/admin-functionality-data-safe-20260915
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Apply surgical admin fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          # Correct paid-only average order value without changing any stored data.
          path = "src/app/api/admin/stats/route.ts"
          text = read(path)
          text = replace_once(
              text,
              '''const emptyFinancialAggregate = {\n  _sum: {\n    subtotalCents: 0,\n    totalCents: 0,\n    deliveryFeeCents: 0,\n    riderTipCents: 0,\n    riderPayoutCents: 0,\n    vendorPayoutCents: 0,\n    platformFeeCents: 0,\n  },\n};''',
              '''const emptyFinancialAggregate = {\n  _sum: {\n    subtotalCents: 0,\n    totalCents: 0,\n    deliveryFeeCents: 0,\n    riderTipCents: 0,\n    riderPayoutCents: 0,\n    vendorPayoutCents: 0,\n    platformFeeCents: 0,\n  },\n  _count: { id: 0 },\n};''',
              "stats aggregate fallback",
          )
          text = text.replace(
              'prisma.order.aggregate({ where: paidOrderWhere(today), _sum: financialSums })',
              'prisma.order.aggregate({\n        where: paidOrderWhere(today),\n        _sum: financialSums,\n        _count: { id: true },\n      })',
              1,
          )
          text = text.replace(
              'prisma.order.aggregate({ where: paidOrderWhere(month), _sum: financialSums })',
              'prisma.order.aggregate({\n        where: paidOrderWhere(month),\n        _sum: financialSums,\n        _count: { id: true },\n      })',
              1,
          )
          text = replace_once(
              text,
              '''averageOrderValueTodayCents:\n        ordersToday > 0 ? Math.round((financialsToday._sum.subtotalCents || 0) / ordersToday) : 0,''',
              '''averageOrderValueTodayCents:\n        financialsToday._count.id > 0\n          ? Math.round((financialsToday._sum.subtotalCents || 0) / financialsToday._count.id)\n          : 0,''',
              "paid average order value",
          )
          write(path, text)

          # Make Order Monitoring server-paginated/searchable while keeping Overview/Operations payload compatible.
          path = "src/app/api/admin/operations/route.ts"
          text = read(path)
          text = replace_once(
              text,
              'import { NextRequest, NextResponse } from "next/server";\n',
              'import { NextRequest, NextResponse } from "next/server";\nimport type { Prisma } from "@prisma/client";\n',
              "operations Prisma type import",
          )
          get_pattern = re.compile(r'export async function GET\(req: NextRequest\) \{.*?\n\}\n\nexport async function POST', re.S)
          new_get = r'''function orderPeriodStart(period: string) {
  const now = new Date();
  if (period === "TODAY") {
    now.setHours(0, 0, 0, 0);
    return now;
  }
  if (period === "MONTH") {
    return new Date(now.getFullYear(), now.getMonth(), 1);
  }
  return null;
}

async function loadOrderPage(req: NextRequest) {
  const params = req.nextUrl.searchParams;
  const page = Math.max(1, Number.parseInt(params.get("page") || "1", 10) || 1);
  const pageSize = Math.min(100, Math.max(1, Number.parseInt(params.get("pageSize") || "40", 10) || 40));
  const status = (params.get("status") || "ALL").trim().toUpperCase();
  const payment = (params.get("payment") || "ALL").trim().toUpperCase();
  const period = (params.get("period") || "ALL").trim().toUpperCase();
  const sort = params.get("sort") === "oldest" ? "asc" : "desc";
  const q = (params.get("q") || "").trim();
  const periodStart = orderPeriodStart(period);

  const filters: Prisma.OrderWhereInput[] = [];
  if (status !== "ALL") filters.push({ status });
  if (payment !== "ALL") filters.push({ paymentStatus: payment });
  if (periodStart) filters.push({ createdAt: { gte: periodStart } });
  if (q) {
    filters.push({
      OR: [
        { publicId: { contains: q } },
        { ozowReference: { contains: q } },
        { vendor: { is: { name: { contains: q } } } },
        { user: { is: { name: { contains: q } } } },
        { user: { is: { email: { contains: q } } } },
        { assignedRider: { is: { fullName: { contains: q } } } },
      ],
    });
  }

  const where: Prisma.OrderWhereInput = filters.length ? { AND: filters } : {};
  const [orders, total] = await Promise.all([
    prisma.order.findMany({
      where,
      orderBy: { createdAt: sort },
      skip: (page - 1) * pageSize,
      take: pageSize,
      select: {
        id: true,
        publicId: true,
        ozowReference: true,
        status: true,
        paymentStatus: true,
        subtotalCents: true,
        deliveryFeeCents: true,
        riderTipCents: true,
        riderPayoutCents: true,
        vendorPayoutCents: true,
        platformFeeCents: true,
        totalCents: true,
        itemsJson: true,
        createdAt: true,
        vendor: { select: { name: true, phone: true, etaMins: true } },
        user: { select: { email: true, name: true } },
        assignedRider: { select: { fullName: true } },
        _count: { select: { items: true } },
      },
    }),
    prisma.order.count({ where }),
  ]);

  const pageCount = Math.max(1, Math.ceil(total / pageSize));
  return {
    orders: orders.map((order) => {
      const financials = parseOrderFinancials(order.itemsJson);
      return {
        id: order.id,
        publicId: order.publicId,
        ozowReference: order.ozowReference,
        status: order.status,
        paymentStatus: order.paymentStatus,
        subtotalCents: order.subtotalCents,
        deliveryFeeCents: order.deliveryFeeCents,
        riderTipCents: order.riderTipCents || financials.riderTipCents,
        riderPayoutCents:
          order.riderPayoutCents || financials.riderPayoutCents || order.deliveryFeeCents,
        vendorPayoutCents:
          order.vendorPayoutCents || financials.vendorPayoutCents || order.subtotalCents,
        platformFeeCents: order.platformFeeCents || financials.platformFeeCents,
        deliveryDistanceKm: financials.deliveryDistanceKm,
        containsAlcohol: financials.containsAlcohol,
        etaMins: order.vendor?.etaMins ?? null,
        totalCents: order.totalCents,
        createdAt: order.createdAt,
        vendorName: order.vendor?.name || "Unknown vendor",
        vendorPhone: order.vendor?.phone || null,
        customerName: order.user?.name || null,
        customerEmail: order.user?.email || null,
        riderName: order.assignedRider?.fullName || null,
        itemCount: order._count.items,
      };
    }),
    orderPagination: { page, pageSize, total, pageCount },
  };
}

export async function GET(req: NextRequest) {
  const guard = await requireAdminRequest(req);
  if (!guard.ok)
    return NextResponse.json({ ok: false, error: guard.error }, { status: guard.status });

  const orderPage = await loadOrderPage(req);
  if (req.nextUrl.searchParams.get("ordersOnly") === "1") {
    return NextResponse.json({ ok: true, ...orderPage });
  }

  const [riders, operations, auditLogs] = await Promise.all([
    prisma.riderApplication.findMany({
      where: { status: "APPROVED" },
      orderBy: { updatedAt: "desc" },
      take: 100,
      select: {
        id: true,
        fullName: true,
        phone: true,
        suburb: true,
        city: true,
        vehicleType: true,
      },
    }),
    listOperationRows(),
    listAdminAuditLogs(),
  ]);

  return NextResponse.json({
    ok: true,
    ...orderPage,
    riders,
    auditLogs,
    ...operations,
  });
}

