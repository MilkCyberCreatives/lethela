name: Temporary E2E expectation patch

on:
  push:
    branches:
      - fix/admin-functionality-data-safe-20260915

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/admin-functionality-data-safe-20260915
          fetch-depth: 0

      - name: Apply exact E2E expectation updates
        run: node scripts/temp-patch-e2e.mjs

      - name: Format changed E2E file
        run: npx prettier --write scripts/e2e-demo.mjs

      - name: Commit only the tested E2E update and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/e2e-demo.mjs
          git rm scripts/temp-patch-e2e.mjs .github/workflows/temp-patch-e2e.yml
          git diff --cached --check
          git commit -m "Update E2E for owner verification and password policy"
          git push origin HEAD:fix/admin-functionality-data-safe-20260915
