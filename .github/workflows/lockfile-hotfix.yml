name: Temporary lockfile hotfix

on:
  push:
    branches:
      - agent/fix-upload-production-errors

permissions:
  contents: write

jobs:
  patch-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-upload-production-errors

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh only nanoid in the lockfile
        run: npm update nanoid@3.3.18 --package-lock-only --ignore-scripts

      - name: Guard application dependency declarations
        run: git diff --exit-code -- package.json

      - name: Verify patched lock entry
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const nanoid = lock.packages?.['node_modules/nanoid'];
          if (nanoid?.version !== '3.3.18') {
            throw new Error(`Expected nanoid 3.3.18, got ${nanoid?.version || 'missing'}`);
          }
          NODE

      - name: Commit lockfile only
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Patch nanoid lockfile vulnerability"
          git push origin HEAD:agent/fix-upload-production-errors
