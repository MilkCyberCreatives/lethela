name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: file:./ci.db
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-nextauth-secret-not-for-production
      VENDOR_SESSION_SECRET: ci-only-vendor-secret
      RIDER_CONSOLE_SECRET: ci-only-rider-secret
      ADMIN_APPROVAL_KEY: ci-only-admin-key
      CRON_SECRET: ci-only-cron-secret
      BANK_DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ALLOW_DEV_ADMIN_BYPASS: "false"
      DEMO_CATALOG_MODE: "false"
      ALLOW_PUBLIC_DEMO_ORDER: "false"
      EMAIL_VERIFICATION_REQUIRED: "false"
      NEXT_PUBLIC_MARKETPLACE_LAUNCH_MODE: prelaunch
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh vulnerable nanoid lock entry
        run: npm update nanoid@3.3.18 --package-lock-only --ignore-scripts

      - name: Guard application dependency declarations
        run: git diff --exit-code -- package.json

      - name: Verify patched lock entry
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const nanoid = lock.packages?.['node_modules/nanoid'];
          if (nanoid?.version !== '3.3.18') {
            throw new Error(`Expected nanoid 3.3.18, got ${nanoid?.version || 'missing'}`);
          }
          NODE

      - name: Commit lockfile repair
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already patched"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Patch nanoid lockfile vulnerability"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run regression tests
        run: npm test

      - name: Check security configuration rules
        env:
          NEXT_PUBLIC_SITE_URL: https://www.lethela.co.za
          NEXTAUTH_URL: https://www.lethela.co.za
          UPLOAD_STORAGE: supabase
          SUPABASE_URL: https://ci-example.supabase.co
          SUPABASE_SERVICE_ROLE: ci-only-service-role
          SUPABASE_PRIVATE_BUCKET: private-ci-documents
          SUPPORT_EMAIL_TO: support@example.test
        run: npm run check:security-env

      - name: Check search-engine readiness
        run: npm run check:search-engine -- --source-only

      - name: Check TypeScript
        run: npm run typecheck

      - name: Check lint
        run: npm run lint

      - name: Check formatting
        run: |
          if ! npm run format:check; then
            npx prettier --write .
            git --no-pager diff -- .
            exit 1
          fi

      - name: Build production application
        run: npm run build
