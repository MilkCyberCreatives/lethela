name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-fix:
    name: Refresh secured dependency lockfile
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/production-hardening' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Resolve secured dependency tree
        run: npm install

      - name: Apply remaining compatible npm security fixes
        run: npm audit fix || true

      - name: Commit dependency updates
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency manifest and lockfile are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Refresh secured dependency lockfile"
          git push origin HEAD:${{ github.head_ref }}

      - name: Report remaining production advisories
        run: npm audit --omit=dev --audit-level=high

  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: file:./ci.db
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-nextauth-secret-not-for-production
      VENDOR_SESSION_SECRET: ci-only-vendor-secret
      RIDER_CONSOLE_SECRET: ci-only-rider-secret
      ADMIN_APPROVAL_KEY: ci-only-admin-key
      BANK_DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ALLOW_DEV_ADMIN_BYPASS: "false"
      DEMO_CATALOG_MODE: "false"
      ALLOW_PUBLIC_DEMO_ORDER: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run regression tests
        run: npm test

      - name: Check TypeScript
        run: npm run typecheck

      - name: Check lint
        run: npm run lint

      - name: Check formatting
        run: |
          if ! npm run format:check; then
            npx prettier --write .
            git --no-pager diff -- .
            exit 1
          fi

      - name: Build production application
        run: npm run build
