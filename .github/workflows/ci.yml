name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: file:./ci.db
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-nextauth-secret-not-for-production
      VENDOR_SESSION_SECRET: ci-only-vendor-secret
      RIDER_CONSOLE_SECRET: ci-only-rider-secret
      ADMIN_APPROVAL_KEY: ci-only-admin-key
      CRON_SECRET: ci-only-cron-secret
      BANK_DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ALLOW_DEV_ADMIN_BYPASS: "false"
      DEMO_CATALOG_MODE: "false"
      ALLOW_PUBLIC_DEMO_ORDER: "false"
      EMAIL_VERIFICATION_REQUIRED: "false"
      NEXT_PUBLIC_MARKETPLACE_LAUNCH_MODE: prelaunch
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format profile repair branch
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/profile-page-repair'
        run: |
          npx prettier --write \
            src/app/profile/page.tsx \
            src/components/profile/OrderHistoryPanel.tsx \
            src/components/profile/ProfileExperiencePanel.tsx \
            src/components/profile/UserProfileForm.tsx \
            tests/profile-page-professional.test.ts
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/workflows/ci.yml src/app/profile/page.tsx src/components/profile/OrderHistoryPanel.tsx src/components/profile/ProfileExperiencePanel.tsx src/components/profile/UserProfileForm.tsx tests/profile-page-professional.test.ts
            git commit -m "Format profile page repair"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run regression tests
        run: npm test

      - name: Check security configuration rules
        env:
          NEXT_PUBLIC_SITE_URL: https://www.lethela.co.za
          NEXTAUTH_URL: https://www.lethela.co.za
          UPLOAD_STORAGE: supabase
          SUPABASE_URL: https://ci-example.supabase.co
          SUPABASE_SERVICE_ROLE: ci-only-service-role
          SUPABASE_PRIVATE_BUCKET: private-ci-documents
          SUPPORT_EMAIL_TO: support@example.test
        run: npm run check:security-env

      - name: Check search-engine readiness
        run: npm run check:search-engine -- --source-only

      - name: Check TypeScript
        run: npm run typecheck

      - name: Check lint
        run: npm run lint

      - name: Check formatting
        run: |
          if ! npm run format:check; then
            npx prettier --write .
            git --no-pager diff -- .
            exit 1
          fi

      - name: Build production application
        run: npm run build
